<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejoindre les bêta-testeurs : Klavyé Kréyòl Karukera</title>
    <link rel="stylesheet" href="assets/theme.css">
    <script>(function(){var t=localStorage.getItem('kreyol-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: var(--ink);
            padding: 20px;
        }

        label {
            display: block;
            color: var(--ink);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--line);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card);
            color: var(--ink);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--hibiscus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--hibiscus) 15%, transparent);
        }

        .checkbox-container {
            display: flex;
            align-items: start;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--stripe);
            border-radius: 10px;
        }

        .checkbox-container input[type="checkbox"] {
            margin-top: 3px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--hibiscus);
        }

        .checkbox-container label {
            margin: 0;
            font-weight: 400;
            color: var(--ink-soft);
            font-size: 14px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--gradient);
            color: var(--paper);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px color-mix(in srgb, var(--hibiscus) 30%, transparent); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .success-message {
            display: none;
            background: #27ae60;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-message.show { display: block; }
        .success-message h3 { margin-bottom: 8px; font-size: 18px; }
        .success-message p { font-size: 14px; opacity: 0.95; }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
            gap: 8px;
        }

        .lang-btn {
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: all 0.3s ease;
            color: var(--ink-soft);
        }

        .lang-btn.active { background: var(--hibiscus); color: var(--paper); border-color: var(--hibiscus); }
        .lang-btn:hover:not(.active) { background: var(--stripe); border-color: var(--hibiscus); }
    </style>
</head>
<body>
    <div class="success-message" id="successMessage">
        <h3 id="successTitle">🎉 Merci beaucoup !</h3>
        <p id="successText">Vous êtes bien sur la liste. Nous vous enverrons un e-mail avec le lien d'inscription au programme bêta du Play Store dès que possible.</p>
    </div>

    <form id="betaForm" action="https://formspree.io/f/meorvlnq" method="POST">
        <label for="email" id="labelEmail">Adresse e-mail :</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="votrenom@email.com"
            required
        >

        <div class="checkbox-container">
            <input type="checkbox" id="consent" required>
            <label for="consent" id="labelConsent">
                J'accepte d'utiliser mon adresse e-mail pour participer au test bêta.
            </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            <span id="btnText">Envoyer</span> ✉️
        </button>
    </form>

    <div class="lang-switch">
        <button type="button" class="lang-btn" id="btnGcf">GCF</button>
        <button type="button" class="lang-btn active" id="btnFr">FR</button>
    </div>

    <script>
        const form = document.getElementById('betaForm');
        const successMessage = document.getElementById('successMessage');
        const btnFr = document.getElementById('btnFr');
        const btnGcf = document.getElementById('btnGcf');
        const submitBtn = document.getElementById('submitBtn');

        const translations = {
            gcf: {
                labelEmail: 'Adrès é-mail :',
                placeholder: 'votrenom@email.com',
                labelConsent: 'Mwen dakò pou itilizé adrès é-mail mwen pou pati-sipé an test bèta la.',
                submit: 'Envoyé',
                successTitle: '🎉 Mèsi onpil!',
                successText: 'Ou bien añ lalis la. Nou ké voyé\'w an é-mail toutswit.',
                error: 'Té ni an pwoblèm. Tanpri éséyé ankò.'
            },
            fr: {
                labelEmail: 'Adresse e-mail :',
                placeholder: 'votrenom@email.com',
                labelConsent: 'J\'accepte d\'utiliser mon adresse e-mail pour participer au test bêta.',
                submit: 'Envoyer',
                successTitle: '🎉 Merci beaucoup !',
                successText: 'Vous êtes bien sur la liste. Nous vous enverrons un e-mail avec le lien d\'inscription au programme bêta du Play Store dès que possible.',
                error: 'Une erreur est survenue. Veuillez réessayer.'
            }
        };

        let currentLang = 'fr';
        let currentError = translations.fr.error;

        function switchLanguage(lang) {
            currentLang = lang;
            currentError = translations[lang].error;

            document.getElementById('labelEmail').textContent = translations[lang].labelEmail;
            document.getElementById('email').placeholder = translations[lang].placeholder;
            document.getElementById('labelConsent').textContent = translations[lang].labelConsent;
            document.getElementById('btnText').textContent = translations[lang].submit;
            document.getElementById('successTitle').textContent = translations[lang].successTitle;
            document.getElementById('successText').textContent = translations[lang].successText;

            btnFr.classList.toggle('active', lang === 'fr');
            btnGcf.classList.toggle('active', lang === 'gcf');
        }

        btnFr.addEventListener('click', () => switchLanguage('fr'));
        btnGcf.addEventListener('click', () => switchLanguage('gcf'));

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            const originalText = document.getElementById('btnText').textContent;
            document.getElementById('btnText').textContent = currentLang === 'gcf' ? 'Ka voyé...' : 'Envoi...';

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                submitBtn.disabled = false;
                document.getElementById('btnText').textContent = originalText;

                if (response.ok) {
                    successMessage.classList.add('show');
                    form.reset();
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 8000);
                } else {
                    alert(currentError);
                }
            })
            .catch(error => {
                submitBtn.disabled = false;
                document.getElementById('btnText').textContent = originalText;
                alert(currentError);
            });
        });
    </script>
</body>
</html>
