<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60"
     role="img" aria-label="Bientôt disponible sur Android">
  <title>Bientôt disponible sur Android</title>
  <!--
    Badge maison, volontairement distinct des badges officiels Google Play :
    l'application n'est pas encore publiée, seul un test fermé est ouvert.
    Le robot Android est reproduit et modifié à partir d'un travail créé et
    partagé par Google, utilisé selon les termes de la licence
    Creative Commons Attribution 3.0 (https://creativecommons.org/licenses/by/3.0/).
  -->
  <rect x="0.5" y="0.5" width="239" height="59" rx="9" fill="#0F1113" stroke="#A6A6A6"/>
  <g transform="translate(15,15) scale(1.1)" fill="#3DDC84">
    <g stroke="#3DDC84" stroke-width="2.6" stroke-linecap="round">
      <line x1="8.5" y1="10" x2="3" y2="2"/>
      <line x1="35.5" y1="10" x2="41" y2="2"/>
    </g>
    <path d="M2,26 A20,20 0 0 1 42,26 Z"/>
    <circle cx="14" cy="18" r="2.3" fill="#0F1113"/>
    <circle cx="30" cy="18" r="2.3" fill="#0F1113"/>
  </g>
  <g fill="#FFFFFF" font-family="Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="76" y="25" font-size="10" letter-spacing="0.8">BIENTÔT DISPONIBLE SUR</text>
    <text x="75" y="48" font-size="22" font-weight="500" letter-spacing="0.2">Android</text>
  </g>
</svg>
