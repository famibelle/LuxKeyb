<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu de partage · Partenariats</title>
<style>
/* Visuel d'aperçu de partage pour la page des partenariats institutionnels.
   Registre volontairement sobre : pas d'appel à l'action, pas de badge de
   magasin, pas de superlatif. La cible est un agent public qui reçoit le lien
   par mail, pas un utilisateur à convertir.

   Palette de communication (docs/assets/theme.css), écrite en dur : le visuel
   doit sortir identique quel que soit le thème du navigateur qui le rend.
   Ne jamais y mêler la palette publicitaire, cf. docs/charte-graphique.html. */
:root {
  --paper:#F5F2EA; --ink:#1C2624; --ink-soft:#4B5750;
  --sea:#0E6E76; --hibiscus:#C94A3B; --sun:#C97F1E;
  --line:rgba(28,38,36,0.13);
  --mono: ui-monospace, "DejaVu Sans Mono", Consolas, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  width:1200px; height:630px; overflow:hidden;
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,"Segoe UI","Helvetica Neue","DejaVu Sans",Arial,sans-serif;
  display:flex; align-items:center; gap:64px;
  padding:0 80px;
}
/* Filet de couleur à gauche : les trois teintes de la palette, dans l'ordre
   de la charte, sans rien avoir à écrire. */
.filet {
  position:absolute; left:0; top:0; bottom:0; width:14px;
  background:linear-gradient(180deg, var(--sea) 0 40%, var(--sun) 40% 70%, var(--hibiscus) 70% 100%);
}
.texte { flex:1; }
.eyebrow {
  font-family:var(--mono); font-size:19px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--sea); margin-bottom:26px;
}
h1 {
  font-size:68px; font-weight:800; line-height:1.05;
  letter-spacing:-0.025em; margin-bottom:18px;
}
.sous { font-size:31px; color:var(--ink-soft); line-height:1.3; margin-bottom:34px; }
.regle { width:96px; height:4px; background:var(--sea); border-radius:2px; margin-bottom:26px; }
.pied { font-size:22px; color:var(--ink-soft); }
.pied b { color:var(--ink); font-weight:700; }
.marque { flex:0 0 268px; }
.marque img { width:268px; height:268px; border-radius:56px; display:block; }
.marque figcaption {
  font-family:var(--mono); font-size:15px; color:var(--ink-soft);
  text-align:center; margin-top:16px; letter-spacing:.04em;
}
</style>
</head>
<body>
<div class="filet"></div>
<div class="texte">
  <p class="eyebrow">Partenariats institutionnels</p>
  <h1>Klavyé Kréyòl<br>Karukera</h1>
  <p class="sous">Le clavier du créole guadeloupéen,<br>pour les usages numériques du quotidien.</p>
  <div class="regle"></div>
  <p class="pied"><b>Gratuit</b> · <b>Open source</b> · <b>Sans collecte de données</b></p>
</div>
<figure class="marque">
  <img src="../logo/klavye-logo-512.png" alt="">
  <figcaption>Édité par Potomitan™</figcaption>
</figure>
</body>
</html>
