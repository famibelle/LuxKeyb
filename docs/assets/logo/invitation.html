<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Invitation au groupe Anbasadè</title>
<link rel="stylesheet" href="../fredoka-embed.css">
<style>
  /* Carre 1080, la taille qui passe partout dans WhatsApp sans etre recadree. */
  html,body{margin:0;padding:0;}
  body{width:1080px;height:1080px;overflow:hidden;}
  .carte{
    width:1080px;height:1080px;box-sizing:border-box;
    background:linear-gradient(157deg,#12848E 0%,#0A5259 52%,#053035 100%);
    color:#F5F2EA;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;padding:90px 80px;text-align:center;
    font-family:'Fredoka',-apple-system,Segoe UI,Roboto,sans-serif;
  }
  .carte img{width:300px;height:300px;border-radius:70px;}
  .titre{font-size:76px;font-weight:600;line-height:1.1;}
  .sous{font-size:34px;font-weight:400;line-height:1.35;color:rgba(245,242,234,.8);max-width:20ch;}
  .lien{font-size:29px;font-weight:400;letter-spacing:.04em;color:rgba(245,242,234,.62);margin-top:6px;}
</style>
</head>
<body>
  <div class="carte">
    <img src="klavye-logo.svg" alt="Logo Klavyé Kréyòl">
    <div class="titre">Anbasadè a kréyòl la&nbsp;!</div>
    <div class="sous">Le groupe des ambassadeurs de Klavyé Kréyòl Karukera</div>
    <div class="lien">potomitan.io</div>
  </div>
</body>
</html>
