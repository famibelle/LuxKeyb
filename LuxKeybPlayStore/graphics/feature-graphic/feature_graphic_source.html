<meta charset="utf-8">
<title>Lëtzebuergesch Clavier — image mise en avant</title>
<style>
  :root{
    --rouge:#ED2939;      /* ROUGE de KeyboardTheme.kt */
    --bleu:#00A1DE;       /* BLEU  de KeyboardTheme.kt */
    --encre:#1F2933;
    --papier:#F5F5F3;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1024px; height:500px; overflow:hidden; }
  body{
    background:var(--papier);
    font-family:"Carlito","Liberation Sans","DejaVu Sans",Arial,sans-serif;
    color:var(--encre);
    display:flex; align-items:center;
    position:relative;
  }
  /* bande drapeau, bord gauche */
  .flag{ position:absolute; left:0; top:0; bottom:0; width:14px; display:flex; flex-direction:column; }
  .flag i{ flex:1; }
  .flag i:nth-child(1){ background:var(--rouge); }
  .flag i:nth-child(2){ background:#fff; }
  .flag i:nth-child(3){ background:var(--bleu); }

  .logo{ width:300px; height:300px; margin-left:66px; flex:0 0 auto; }
  .logo img{ width:100%; height:100%; object-fit:contain; }

  .txt{ margin-left:48px; }
  .name{ font-size:64px; font-weight:700; line-height:1.02; letter-spacing:-.01em; }
  .name .lb{ color:var(--rouge); display:block; }
  .rule{ width:96px; height:6px; background:var(--bleu); border-radius:3px; margin:22px 0 20px; }
  .claim{ font-size:27px; font-weight:600; line-height:1.35; color:#3A4552; }
  .claim b{ color:var(--encre); font-weight:700; }

  .chips{ display:flex; gap:12px; margin-top:26px; }
  .chip{
    font-size:22px; font-weight:700; color:#fff; padding:9px 22px; border-radius:22px;
    display:flex; align-items:center; gap:9px;
  }
  .chip small{ font-size:14px; font-weight:700; opacity:.8; letter-spacing:.06em; }
  .chip.lb{ background:var(--rouge); }
  .chip.fr{ background:var(--bleu); }
</style>
