<!-- Image mise en avant Play Store, 1024 x 500, sans transparence.
     Rendu : python3 build_graphics.py feature
     Le sujet est le bénéfice : tapez, il devine vos mots ; parlez, il écrit ce
     que vous dites. Deux vraies captures de la 37.4.5 (émulateur pixel9,
     16 octobre 2026), sur deux exemples du LOD qui ont une traduction
     officielle (corpus ZLS) :
       - dictée : « op der Kiermes iessen ech gär e Bréitche mat Sauerkraut an
         engem Wirschtchen » (à la kermesse, j'aime manger un petit pain à la
         choucroute et la saucisse de Francfort). L'émulateur n'entend pas :
         champ pris sur la capture du texte tapé, bandeau LuxASR et clavier sur
         celle de l'écoute (sans le 🎤 provisoire du champ) ;
       - suggestions : « bei eis doheem këmmert meng Mamm sech ëm
         d'Chrëschtdekoratioun » (chez nous, c'est ma mère qui s'occupe de la
         décoration de Noël). Après « meng », avant toute lettre, le clavier
         propose Mamm · Schwëster · Frëndin.
     Derrière, la carte Kran du carnet. Aucune promesse de confidentialité
     ici : la dictée envoie la voix à LuxASR, et une bannière n'a pas la place
     de le dire honnêtement ; la nuance tient dans la fiche. Images embarquées
     en base64 : le fichier est autonome. -->
<meta charset="utf-8">
<title>Lëtzebuergesch Clavier, image mise en avant</title>
<style>
  :root{
    --rouge:#ED2939;      /* ROUGE de KeyboardTheme.kt */
    --bleu:#00A1DE;       /* BLEU  de KeyboardTheme.kt */
    --encre:#1F2933;
    --papier:#F5F5F3;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1024px; height:500px; overflow:hidden; }
  body{
    background:var(--papier);
    font-family:"Carlito","Liberation Sans","DejaVu Sans",Arial,sans-serif;
    color:var(--encre);
    position:relative;
  }
  /* bande drapeau, bord gauche */
  .flag{ position:absolute; left:0; top:0; bottom:0; width:14px; display:flex; flex-direction:column; }
  .flag i{ flex:1; }
  .flag i:nth-child(1){ background:var(--rouge); }
  .flag i:nth-child(2){ background:#fff; }
  .flag i:nth-child(3){ background:var(--bleu); }

  .txt{ position:absolute; left:50px; top:0; bottom:0; width:440px;
        display:flex; flex-direction:column; justify-content:center; }
  .tete{ display:flex; align-items:center; gap:12px; }
  .logo{ width:72px; height:72px; flex:0 0 auto; }
  .logo img{ width:100%; height:100%; object-fit:contain; }
  .name{ font-size:30px; font-weight:700; line-height:1.0; }
  .name .lb{ color:var(--rouge); display:block; }
  .slogan{ font-size:42px; font-weight:700; line-height:1.06; letter-spacing:-.01em; margin-top:28px; }
  .slogan span{ color:var(--bleu); }
  .rule{ width:96px; height:6px; background:var(--rouge); border-radius:3px; margin:22px 0 16px; }
  .claim{ font-size:25px; font-weight:600; line-height:1.35; color:#3A4552; }
  .claim b{ color:var(--encre); font-weight:700; }

  /* deux cartes du carnet glissées derrière l'écran */
  .cartes img{ position:absolute; filter:drop-shadow(0 8px 14px rgba(31,41,51,.30)); }
  .cartes .k{ left:806px; top:30px;  width:184px; transform:rotate(11deg); }
  .cartes .a{ left:836px; top:232px; width:166px; transform:rotate(-6deg); }

  /* la dictée en cours, vraie capture */
  .ecran{ position:absolute; left:462px; top:42px; width:440px; height:418px;
          border-radius:24px; overflow:hidden; background:#fff; z-index:2;
          box-shadow:0 14px 34px rgba(31,41,51,.30), 0 0 0 1px rgba(31,41,51,.08); }
  /* la barre de suggestions, vraie capture : la prédiction, que la dictée cache */
  .sugg{ position:absolute; left:640px; top:348px; width:380px; border-radius:18px; overflow:hidden;
         background:#fff; z-index:3; transform:rotate(-3deg);
         box-shadow:0 12px 28px rgba(31,41,51,.35), 0 0 0 1px rgba(31,41,51,.08); }
  .sugg img{ width:380px; display:block; }
  .ecran img{ width:440px; display:block; }
</style>
