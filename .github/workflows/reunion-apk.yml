name: 🎙️ Lëtzebuergesch Réunion — APK

# L'application de réunion (android_reunion/) : transcription et traduction en
# direct par LuxASR, transcription complète après la réunion, compte rendu par
# Claude. Trois jobs : le noyau sur la JVM, l'application sur un émulateur,
# puis l'APK, signé avec la clé du clavier pour que chaque version s'installe
# par-dessus la précédente.
#
# L'APK reste un artefact du workflow, réservé à qui a accès au dépôt : il
# n'est pas publié en Release. LuxASR ouvre son API « for limited access » et
# demande qu'on le contacte avant de l'intégrer dans une application.

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'android_reunion/**'
      - '.github/workflows/reunion-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android_reunion/**'
      - '.github/workflows/reunion-apk.yml'
  workflow_dispatch:

jobs:
  noyau:
    name: 🧪 Noyau (tests JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Tests du noyau
        run: cd android_reunion && gradle -p noyau test --no-daemon
      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reunion-noyau-tests
          path: android_reunion/noyau/build/reports/tests/
          retention-days: 7

  appareil:
    name: 📱 Tests sur émulateur
    runs-on: ubuntu-latest
    needs: noyau
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Accès à KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: SDK Claude, OkHttp, AAC et écrans sur Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android_reunion && gradle connectedDebugAndroidTest --no-daemon
      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reunion-appareil-tests
          path: android_reunion/app/build/reports/androidTests/
          retention-days: 7

  apk:
    name: 📦 APK
    runs-on: ubuntu-latest
    needs: noyau
    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Clé de signature
        id: cle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android_reunion/$KEYSTORE_FILE
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "🔐 APK signé avec la clé de production"
          else
            # Sans les secrets (pull request d'un fork) : un APK debug, pour vérifier que tout compile.
            echo "type=debug" >> "$GITHUB_OUTPUT"
            echo "⚠️ Secrets absents : APK debug"
          fi
      - name: Construction
        run: |
          cd android_reunion
          if [ "${{ steps.cle.outputs.type }}" = "release" ]; then gradle assembleRelease --no-daemon; else gradle assembleDebug --no-daemon; fi
      - name: Vérification de la signature
        if: steps.cle.outputs.type == 'release'
        run: |
          set -euo pipefail
          APK=$(ls android_reunion/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "certificate DN" /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then echo "❌ signé avec la clé debug"; exit 1; fi
          ls -lh "$APK"
      - name: APK
        uses: actions/upload-artifact@v6
        with:
          name: letzebuergesch-reunion-${{ steps.cle.outputs.type }}-apk
          path: android_reunion/app/build/outputs/apk/*/*.apk
          retention-days: 30
