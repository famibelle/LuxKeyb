name: 🇱🇺 Build Lëtzebuergesch Clavier - Detailed Steps

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]
    paths:
      - 'android_keyboard/**'
      - '.github/workflows/**'
      - 'Dictionnaires/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'android_keyboard/**'
      - 'Dictionnaires/**'
  workflow_dispatch:

jobs:
  # 📊 ÉTAPE 1 : GÉNÉRATION DICTIONNAIRE
  generate-dictionary:
    name: 🔤 Generate Lëtzebuergesch Dictionary
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    outputs:
      dict-count: ${{ steps.stats.outputs.dict-count }}
      ngrams-count: ${{ steps.stats.outputs.ngrams-count }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 📦 Generate Fresh Lëtzebuergesch Dictionary
      run: |
        echo "🔄 Régénération du dictionnaire luxembourgeois depuis Hugging Face..."
        # LuxAlign et LETZ sont publics : HF_TOKEN n'est plus requis. Il reste
        # transmis parce qu'un jeton valide relève les quotas de téléchargement
        # anonymes, mais son absence n'est plus une cause d'échec.
        echo "🔑 Token configuré (facultatif): $(if [ -n "$HF_TOKEN" ]; then echo "✅ Oui"; else echo "❌ Non"; fi)"

        cd Dictionnaires
        python -m pip install --upgrade pip
        pip install datasets huggingface_hub

        # LuxembourgishComplet.py écrit directement dans les assets Android,
        # au seul format que le moteur sait lire.
        # --strict : refuser le corpus local de secours plutôt que de
        # reconstruire les n-grammes sur quinze phrases.
        python LuxembourgishComplet.py --strict

        # Les formes du LOD complètent le dictionnaire de fréquences là où le
        # corpus ne peut rien : LuxAlign est du journalisme RTL, qui n'écrit
        # jamais « Läffelen », « sprang » ni « denks ». L'actif est SÉPARÉ de
        # luxemburgish_dict.json — voir generate_lod_forms.py — et doit être
        # produit avant generate_translations.py, qui glose aussi ces formes.
        python generate_lod_forms.py --strict

        # Le jeu de phrases à trous se dérive du dictionnaire et des n-grammes
        # qui viennent d'être écrits : il choisit le mot masqué parmi les formes
        # retenues et tire ses leurres du modèle de contexte. Le régénérer ici
        # n'est pas un confort — la version committée référencerait des mots
        # qu'un corpus rafraîchi peut avoir fait passer sous le seuil de
        # fréquence, et ClozeAssetTest le verrait échouer.
        python generate_cloze.py --strict

        # La table des traductions se dérive elle aussi du dictionnaire qui
        # vient d'être écrit : elle ne glose que des formes qui y figurent.
        # La régénérer ici évite qu'un corpus rafraîchi laisse sans traduction
        # les mots qu'il vient d'introduire — les jeux tirent leurs mots parmi
        # les formes glosées, donc une table périmée rétrécit leur réserve en
        # silence. La source (LOD, data.public.lu) est publique et sans jeton.
        python generate_translations.py --strict

        echo "🔍 Fichiers produits:"
        ls -lh ../android_keyboard/app/src/main/assets/luxemburgish_*.json

    - name: 🎯 Verify Generated Assets
      run: |
        A=android_keyboard/app/src/main/assets

        for f in luxemburgish_dict.json luxemburgish_ngrams.json luxemburgish_cloze.json luxemburgish_translations.json luxemburgish_lod_forms.json; do
          if [ ! -f "$A/$f" ]; then
            echo "::error::$f n'a pas été produit par le pipeline."
            ls -la "$A/" || echo "Dossier inexistant"
            exit 1
          fi
        done

        # Garde-fou de format : le dictionnaire DOIT être un tableau
        # [[mot, fréquence], ...], jamais un objet {mot: fréquence}. Un objet se
        # parse en JSONException au chargement et désactive silencieusement
        # toutes les suggestions — un JSON valide et non vide passerait sinon
        # toutes les autres vérifications. C'est le bug qui a cassé la v10.2.6
        # en amont.
        if ! jq -e 'type == "array"' "$A/luxemburgish_dict.json" > /dev/null; then
          echo "::error::luxemburgish_dict.json n'est PAS un tableau [[mot, fréquence], ...]. Build arrêté avant de publier un APK aux suggestions muettes."
          exit 1
        fi

        # Garde-fou de repli silencieux : si un corpus est indisponible, le
        # script peut basculer sur un corpus local de secours de quelques
        # dizaines de lignes. Le fichier serait bien formé, mais l'APK
        # livrerait un dictionnaire vide de sens.
        #
        # Le seuil est calé sous la production normale (37 734 mots depuis
        # LuxAlign + LETZ) mais très au-dessus de ce que produirait une source
        # unique : LETZ seul ne donnerait que ~2 500 formes au-dessus du seuil
        # de fréquence. 20 000 sépare donc franchement les deux cas.
        DICT_COUNT=$(jq 'length' "$A/luxemburgish_dict.json")
        if [ "$DICT_COUNT" -lt 20000 ]; then
          echo "::error::Dictionnaire anormalement petit ($DICT_COUNT mots, moins de 20000). Un des deux corpus (LuxAlign, LETZ) n'a probablement pas été chargé."
          exit 1
        fi

        # Garde-fou de contexte : le moteur interroge d'abord une clé à deux
        # mots (« an der ») avant de se rabattre sur le dernier mot seul. Sans
        # cette famille de clés, la prédiction contextuelle ne sert à rien.
        TWO_WORD=$(jq '[keys[] | select(test(" "))] | length' "$A/luxemburgish_ngrams.json")
        if [ "$TWO_WORD" -eq 0 ]; then
          echo "::error::Le modèle n-grammes ne contient aucune clé à deux mots : les trigrammes ne sont pas exportés, le contexte est inopérant."
          exit 1
        fi

        # Garde-fou de casse (Groussschreiwung). Le luxembourgeois capitalise
        # tous les substantifs : depuis le 2026-08-29 la casse est élue sur le
        # corpus, hors tête de phrase, et 25 845 des 38 410 entrées livrées
        # portent une majuscule. Un retour accidentel au repli en minuscules
        # (`contenu_texte.lower()`) produirait un dictionnaire parfaitement
        # valide, de la bonne taille, du bon type — et un clavier qui ne
        # propose plus jamais « Joer » ni « Haus ». Rien ne le signalerait.
        CAPS=$(jq '[.[] | .[0] | select(test("^\\p{Lu}"))] | length' "$A/luxemburgish_dict.json")
        if [ "$CAPS" -lt 15000 ]; then
          echo "::error::Seulement $CAPS entrées capitalisées (moins de 15000) : la casse canonique n'a pas été élue, le dictionnaire est replié en minuscules."
          exit 1
        fi

        # Même garde-fou côté n-grammes : leurs CLÉS restent en minuscules (le
        # moteur les fabrique depuis un historique replié), seuls les mots
        # CANDIDATS portent la casse canonique. S'ils la perdent, la barre de
        # suggestions retombe en minuscules sans que rien n'échoue.
        NG_CAPS=$(jq '[.[][] | .word | select(test("^\\p{Lu}"))] | length' "$A/luxemburgish_ngrams.json")
        if [ "$NG_CAPS" -lt 10000 ]; then
          echo "::error::Seulement $NG_CAPS candidats n-grammes capitalisés (moins de 10000) : les prédictions ont perdu leur casse canonique."
          exit 1
        fi

        # Garde-fou de volumétrie des n-grammes, désormais indépendant de
        # celui du dictionnaire : les deux sont reconstruits à zéro à chaque
        # exécution, mais les contextes retenus dépendent du seuil
        # d'occurrences et s'effondrent bien plus vite que le lexique quand le
        # corpus rétrécit. Production normale : 26 172 contextes.
        NGRAMS_COUNT=$(jq 'length' "$A/luxemburgish_ngrams.json")
        if [ "$NGRAMS_COUNT" -lt 15000 ]; then
          echo "::error::Modèle n-grammes anormalement petit ($NGRAMS_COUNT contextes, moins de 15000). Le corpus source est probablement incomplet."
          exit 1
        fi


        # Garde-fou du jeu de phrases à trous. Une question dont la réponse ne
        # figure pas dans ses propositions, ou dont la phrase a perdu son
        # marqueur, se joue sans être gagnable : le fichier reste du JSON
        # valide et l'écran s'affiche normalement.
        CLOZE_COUNT=$(jq '.items | length' "$A/luxemburgish_cloze.json")
        if [ "$CLOZE_COUNT" -lt 1000 ]; then
          echo "::error::Jeu de phrases à trous anormalement petit ($CLOZE_COUNT questions, moins de 1000)."
          exit 1
        fi

        CLOZE_CASSEES=$(jq '[.items[] | select((.s | test("___")) | not)] | length' "$A/luxemburgish_cloze.json")
        if [ "$CLOZE_CASSEES" -ne 0 ]; then
          echo "::error::$CLOZE_CASSEES phrases à trous sans marqueur ___ : elles s'afficheraient sans trou."
          exit 1
        fi

        # L'attribution voyage dans l'actif lui-même, et le jeu l'affiche :
        # les phrases livrées sont des extraits de corpus CC BY-NC et CC BY.
        if ! jq -e '.sources | length >= 2' "$A/luxemburgish_cloze.json" > /dev/null; then
          echo "::error::luxemburgish_cloze.json ne porte pas l'attribution de ses corpus sources."
          exit 1
        fi

        # Garde-fou des formes LOD. Leur absence ne casse rien de visible :
        # SuggestionEngine journalise et retombe sur la couverture du corpus,
        # l'APK s'installe, les suggestions marchent — elles connaissent
        # simplement trois fois moins de mots, ce qui est le défaut qu'on
        # corrigeait. Mesuré à 84 855 / 26 424 le 2026-09-02.
        LOD_SUGGEST=$(jq '.suggest | length' "$A/luxemburgish_lod_forms.json")
        LOD_SPELL=$(jq '.spellcheck | length' "$A/luxemburgish_lod_forms.json")
        if [ "$LOD_SUGGEST" -lt 40000 ]; then
          echo "::error::Seulement $LOD_SUGGEST formes LOD proposables (attendu >= 40000). L'index de recherche du LOD a probablement changé de structure."
          exit 1
        fi
        if [ "$LOD_SPELL" -lt 10000 ]; then
          echo "::error::Seulement $LOD_SPELL variantes de la règle d'Eifel : le correcteur soulignerait des formes correctes."
          exit 1
        fi

        # Les deux paliers doivent rester disjoints, et disjoints du
        # dictionnaire : un doublon ferait charger deux fois la même forme et
        # afficher deux fois la même suggestion.
        # L'appartenance passe par un objet et non par `index` : sur 123 000
        # formes contre 38 000, la recherche linéaire ne finit pas.
        DOUBLONS=$(jq -n --slurpfile d "$A/luxemburgish_dict.json" --slurpfile l "$A/luxemburgish_lod_forms.json" \
          '($d[0] | map({(.[0] | ascii_downcase): 1}) | add) as $c
           | [($l[0].suggest + $l[0].spellcheck)[] | ascii_downcase | select($c[.])]
           | length')
        if [ "$DOUBLONS" -ne 0 ]; then
          echo "::error::$DOUBLONS formes LOD sont déjà dans luxemburgish_dict.json : les deux actifs ont été régénérés séparément."
          exit 1
        fi

        # Garde-fou des traductions. Les trois jeux qui tirent un mot ne le
        # tirent que parmi les formes glosées : une table effondrée ne fait
        # rien planter, elle fait retomber les jeux sur leur repli et le mot à
        # trouver redevient muet — exactement le défaut que la table corrige.
        TRAD_COUNT=$(jq '.translations | length' "$A/luxemburgish_translations.json")
        if [ "$TRAD_COUNT" -lt 15000 ]; then
          echo "::error::Table de traductions anormalement petite ($TRAD_COUNT formes, moins de 15000). L'appariement avec le LOD a probablement échoué."
          exit 1
        fi

        # Wuertriet est la réserve la plus étroite du lot : cinq lettres, une
        # seule longueur. C'est elle qui se vide en premier si la couverture
        # baisse, et c'est donc elle qu'on compte.
        TRAD_CINQ=$(jq '[.translations | keys[] | select(length == 5)] | length' "$A/luxemburgish_translations.json")
        if [ "$TRAD_CINQ" -lt 300 ]; then
          echo "::error::Seulement $TRAD_CINQ mots de 5 lettres traduits : Wuertriet n'aurait plus de réserve."
          exit 1
        fi

        # Le LOD est en CC0 et n'impose donc rien, mais on cite le ZLS :
        # l'attribution voyage dans l'actif et l'écran « À propos » l'affiche.
        if ! jq -e '.attribution | length >= 1' "$A/luxemburgish_translations.json" > /dev/null; then
          echo "::error::luxemburgish_translations.json ne porte pas le crédit du LOD."
          exit 1
        fi

        # LuxAlign impose l'attribution de ses auteurs (CC BY-NC 4.0), LETZ
        # aussi (CC BY 4.0). Le fichier qui porte cette obligation est suivi
        # en git : s'il disparaît, l'APK n'est plus distribuable en l'état.
        if [ ! -f Dictionnaires/CORPUS.md ]; then
          echo "::error::Dictionnaires/CORPUS.md manquant : les corpus sources exigent l'attribution de leurs auteurs."
          exit 1
        fi

        echo "✅ Format, volumétrie et familles de clés vérifiés"

    # Les contrôles ci-dessus vérifient la FORME des assets ; celui-ci vérifie
    # ce que l'utilisateur ressent — le nombre de frappes économisées. Deux
    # constantes de score ont cessé de fonctionner en silence quand la
    # fréquence maximale du corpus a été multipliée par six, et les deux sont
    # passées à travers une suite de tests entièrement verte : un dictionnaire
    # bien formé, de la bonne taille, peut parfaitement être mal classé.
    #
    # Mesuré sur ParaLux, dont aucune phrase n'est dans le corpus
    # d'entraînement. Le fichier exporté reste dans le répertoire temporaire du
    # runner : rien de ce jeu d'évaluation n'est redistribué.
    - name: ⌨️ Banc de frappes (classement des suggestions)
      run: |
        set -euo pipefail
        python docs/scripts/export_paralux.py "$RUNNER_TEMP/paralux.json"
        node docs/scripts/bench_frappes.js "$RUNNER_TEMP/paralux.json"
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    - name: 📈 Dictionary Statistics
      id: stats
      run: |
        A=android_keyboard/app/src/main/assets
        DICT_COUNT=$(jq 'length' "$A/luxemburgish_dict.json")
        NGRAMS_COUNT=$(jq 'length' "$A/luxemburgish_ngrams.json")
        TWO_WORD=$(jq '[keys[] | select(test(" "))] | length' "$A/luxemburgish_ngrams.json")
        echo "📊 $DICT_COUNT mots, $NGRAMS_COUNT contextes (dont $TWO_WORD à deux mots)"
        echo "dict-count=$DICT_COUNT" >> $GITHUB_OUTPUT
        echo "ngrams-count=$NGRAMS_COUNT" >> $GITHUB_OUTPUT

    # 🔧 FIX CRITIQUE : sans cet upload, chaque job de build ci-dessous fait son
    # propre "actions/checkout" et récupère donc la version du dictionnaire
    # committée dans git (figée au dernier commit), jamais celle régénérée
    # ci-dessus depuis Hugging Face. Le "needs: generate-dictionary" garantit
    # seulement l'ordre d'exécution, pas le partage de fichiers entre jobs.
    - name: 📤 Upload Fresh Dictionary Assets
      uses: actions/upload-artifact@v6
      with:
        name: lux-dictionary-assets
        path: |
          android_keyboard/app/src/main/assets/luxemburgish_dict.json
          android_keyboard/app/src/main/assets/luxemburgish_ngrams.json
          android_keyboard/app/src/main/assets/luxemburgish_cloze.json
          android_keyboard/app/src/main/assets/luxemburgish_translations.json
          android_keyboard/app/src/main/assets/luxemburgish_lod_forms.json
        retention-days: 1

  # 🧪 ÉTAPE 1 bis : TESTS UNITAIRES
  # Absents du pipeline amont : `./gradlew test` n'y était qu'une étape locale et
  # manuelle. Les faire tourner ici est ce qui donne leur valeur aux garde-fous
  # ci-dessus, qui vérifient le format des données mais pas le comportement du
  # moteur qui les lit.
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: generate-dictionary

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: lux-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: 🧪 Run Unit Tests
      run: cd android_keyboard && gradle testDebugUnitTest --no-daemon

    - name: 📤 Upload Test Report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: unit-test-report
        path: android_keyboard/app/build/reports/tests/testDebugUnitTest/
        retention-days: 7

  # 🔧 ÉTAPE 2A : BUILD DEBUG APK
  build-debug-apk:
    name: 🔧 Build Debug APK
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: lux-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        if [ -f "android_keyboard/app/src/main/assets/luxemburgish_dict.json" ]; then
          echo "✅ luxemburgish_dict.json présent"
        else
          echo "❌ luxemburgish_dict.json manquant"
          exit 1
        fi
        
        if [ -f "android_keyboard/app/src/main/assets/luxemburgish_ngrams.json" ]; then
          echo "✅ luxemburgish_ngrams.json présent"
        else
          echo "❌ luxemburgish_ngrams.json manquant"
          exit 1
        fi
        
        echo "📊 Tailles des fichiers:"
        ls -lh android_keyboard/app/src/main/assets/luxemburgish_*.json

    - name: 🧹 Clean Project
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle clean --no-daemon --scan

    - name: 🔨 Build Debug APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle assembleDebug --no-daemon --scan

    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v6
      with:
        name: lux-keyboard-debug-apk
        path: android_keyboard/app/build/outputs/apk/debug/*.apk
        retention-days: 7

  # 📦 ÉTAPE 2B : BUILD DEBUG AAB  
  build-debug-aab:
    name: 📦 Build Debug AAB
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: lux-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        ls -lh android_keyboard/app/src/main/assets/luxemburgish_*.json || echo "❌ Fichiers dictionnaire manquants"

    - name: 📦 Build Debug AAB
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle bundleDebug --no-daemon --scan

    - name: 📤 Upload Debug AAB
      uses: actions/upload-artifact@v6
      with:
        name: lux-keyboard-debug-aab
        path: android_keyboard/app/build/outputs/bundle/debug/*.aab
        retention-days: 7

  # 🚀 ÉTAPE 3A : BUILD RELEASE APK
  build-release-apk:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: lux-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        ls -lh android_keyboard/app/src/main/assets/luxemburgish_*.json || echo "❌ Fichiers dictionnaire manquants"

    - name: 🔐 Setup Production Keystore for Release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android_keyboard
        
        if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
          echo "🔑 Decoding production keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_FILE
          echo "✅ Production keystore decoded: $KEYSTORE_FILE"
          echo "🔐 Release APK will be signed with production key"
          
          # Vérification du keystore
          keytool -list -v -keystore $KEYSTORE_FILE -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep "SHA1:" || echo "⚠️ SHA1 verification"
        else
          echo "⚠️ Production secrets not available, generating debug keystore..."
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: 🧹 Clean Project  
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle clean --no-daemon --scan

    - name: 🚀 Build Release APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle assembleRelease --no-daemon --scan

    - name: 🔐 Verify Release APK Signature
      run: |
        set -euo pipefail
        cd android_keyboard
        APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -1)
        echo "📦 $APK_FILE"

        # apksigner comprend les signatures v2/v3, contrairement à jarsigner qui
        # ne voit que le schéma v1.
        APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
        echo "🔧 $APKSIGNER"
        "$APKSIGNER" verify --verbose --print-certs "$APK_FILE" 2>&1 | tee /tmp/apk-verify.txt

        # Sans cette assertion, un fichier de sortie vide ferait passer le
        # garde-fou suivant sans rien avoir vérifié du tout.
        if ! grep -q "certificate DN" /tmp/apk-verify.txt; then
          echo "❌ apksigner n'a produit aucune information de certificat"
          exit 1
        fi

        if grep -q "CN=Android Debug" /tmp/apk-verify.txt; then
          echo "❌ APK signé avec la clé debug : ce n'est pas un artefact publiable"
          exit 1
        fi

        echo "✅ APK signé en production"

    - name: 📤 Upload Release APK
      uses: actions/upload-artifact@v6
      with:
        name: lux-keyboard-release-apk
        path: android_keyboard/app/build/outputs/apk/release/*.apk
        retention-days: 30

  # 🎯 ÉTAPE 3B : BUILD RELEASE AAB
  build-release-aab:
    name: 🎯 Build Release AAB
    runs-on: ubuntu-latest
    needs: generate-dictionary

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: 📥 Download Fresh Dictionary Assets
      uses: actions/download-artifact@v7
      with:
        name: lux-dictionary-assets
        path: android_keyboard/app/src/main/assets/

    - name: ☕ Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 🔧 Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1
        cache-read-only: false

    - name: ✅ Verify Dictionary Assets Present
      run: |
        echo "🔍 Vérification des assets de dictionnaire..."
        ls -lh android_keyboard/app/src/main/assets/luxemburgish_*.json || echo "❌ Fichiers dictionnaire manquants"

    - name: 🔐 Setup Production Keystore for Release AAB
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        cd android_keyboard
        
        if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_BASE64" ]; then
          echo "🔑 Decoding production keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > $KEYSTORE_FILE
          echo "✅ Production keystore decoded: $KEYSTORE_FILE"
          echo "🏪 Release AAB will be signed for Google Play Store"
          
          # Vérification du keystore
          keytool -list -v -keystore $KEYSTORE_FILE -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep "SHA1:" || echo "⚠️ SHA1 verification"
        else
          echo "⚠️ Production secrets not available, generating debug keystore..."
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: 🎯 Build Release AAB
      env:
        GRADLE_OPTS: "-Dorg.gradle.buildscan.termsOfServiceUrl=https://gradle.com/terms-of-service -Dorg.gradle.buildscan.termsOfServiceAgree=yes"
      run: cd android_keyboard && gradle bundleRelease --no-daemon --scan

    - name: Verify AAB Signature
      run: |
        # pipefail : sans lui, le code de sortie d'un pipeline est celui du
        # dernier maillon, et un jarsigner en échec passait inaperçu.
        set -euo pipefail
        cd android_keyboard
        echo "🔍 Verifying AAB signature..."
        AAB_FILE="app/build/outputs/bundle/release/app-release.aab"

        if [ ! -f "$AAB_FILE" ]; then
          echo "❌ AAB not found at $AAB_FILE"
          exit 1
        fi

        echo "📊 AAB Details:"
        ls -lh "$AAB_FILE"

        echo ""
        echo "🔐 Certificate Information:"
        # Pas de -strict : une clé auto-signée (la nôtre) y déclencherait un
        # avertissement de chaîne non validée, donc un code de sortie non nul.
        jarsigner -verify -verbose -certs "$AAB_FILE" > /tmp/aab-verify.txt
        # grep -m1 plutôt que « grep | head -1 » : head ferme le tube dès la
        # première ligne, grep meurt en erreur d'écriture, et pipefail fait
        # échouer l'étape sur un AAB pourtant valide.
        grep -m1 "CN=" /tmp/aab-verify.txt

        # jarsigner n'échoue pas toujours sur une archive non signée : on exige
        # la mention explicite de vérification.
        if ! grep -q "jar verified" /tmp/aab-verify.txt; then
          echo "❌ AAB non signé ou signature invalide"
          exit 1
        fi

        if grep -q "CN=Android Debug" /tmp/aab-verify.txt; then
          echo "❌ AAB signé avec la clé debug : refusé par le Play Store"
          exit 1
        fi

        echo ""
        echo "🔑 SHA Fingerprints:"
        keytool -printcert -jarfile "$AAB_FILE" 2>&1 | grep "SHA" || echo "Unable to extract SHA via keytool"
        echo ""
        echo "✅ AAB signé en production, prêt pour la Play Console"

    - name: Upload Release AAB
      uses: actions/upload-artifact@v6
      with:
        name: lux-keyboard-release-aab  
        path: android_keyboard/app/build/outputs/bundle/release/*.aab
        retention-days: 30

  # 📱 ÉTAPE 4 : VALIDATION & TESTS
  validate-builds:
    name: 🔍 Validate Builds
    runs-on: ubuntu-latest
    # unit-tests est inclus pour qu'un test rouge bloque la release, et pas
    # seulement un build cassé.
    needs: [unit-tests, build-debug-apk, build-debug-aab, build-release-apk, build-release-aab]
    
    steps:
    - name: 📥 Download All Artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./all-builds

    - name: 📊 Build Summary
      run: |
        echo "🎯 BUILD VALIDATION SUMMARY"
        echo "=========================="
        
        find ./all-builds -name "*.apk" -o -name "*.aab" | while read file; do
          echo "📱 $(basename "$file"): $(stat -f%z "$file" 2>/dev/null || stat -c%s "$file") bytes"
        done

    - name: ✅ Mark Builds Valid
      run: echo "✅ All builds completed successfully!"

  # 🎉 ÉTAPE 5 : CRÉATION RELEASE (si tag)
  create-release:
    name: 🎉 Create Release
    runs-on: ubuntu-latest
    needs: [generate-dictionary, validate-builds]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0
      
    - name: 📝 Extract Release Notes from CHANGELOG
      id: changelog
      run: |
        echo "📖 Extraction des notes de release depuis android_keyboard/CHANGELOG.md..."

        # Garde-fou : la section en tête du CHANGELOG doit correspondre au tag
        # poussé, sinon ce sont les notes d'une version précédente qui seraient
        # publiées en silence (vécu sur v10.2.1 et v10.2.3, jamais détecté)
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        CHANGELOG_VERSION=$(sed -n 's/^## \[\(.*\)\].*/\1/p' android_keyboard/CHANGELOG.md | head -1)

        echo "🏷️  Tag poussé: $GITHUB_REF_NAME (version $TAG_VERSION)"
        echo "📄 Version en tête du CHANGELOG: $CHANGELOG_VERSION"

        if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
          echo "::error::La section en tête de android_keyboard/CHANGELOG.md ([$CHANGELOG_VERSION]) ne correspond pas au tag poussé ($GITHUB_REF_NAME). Ajoutez une entrée '## [$TAG_VERSION]' dans le CHANGELOG avant de tagger."
          exit 1
        fi

        # Extraire la section de la version actuelle du CHANGELOG
        # On prend tout depuis le premier ## jusqu'au prochain ## ou fin de fichier
        RELEASE_NOTES=$(awk '/^## / {if (found) exit; found=1; next} found' android_keyboard/CHANGELOG.md | sed '/^## /q' | sed '$d')
        
        # Si le CHANGELOG n'a pas de contenu, utiliser un message par défaut
        if [ -z "$RELEASE_NOTES" ]; then
          RELEASE_NOTES="🎯 Nouvelle version du Lëtzebuergesch Clavier
          
          Consultez le CHANGELOG.md complet pour tous les détails des améliorations."
        fi
        
        # Sauvegarder dans un fichier pour utilisation ultérieure
        echo "$RELEASE_NOTES" > /tmp/release-notes.md
        
        echo "✅ Notes de release extraites avec succès"
        echo "📄 Aperçu des notes:"
        head -20 /tmp/release-notes.md
    
    - name: 📥 Download All Build Artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: lux-keyboard-*
        path: ./all-artifacts

    - name: 📎 Prepare All Release Assets with Custom Names
      run: |
        echo "📁 Préparation de tous les assets pour release..."
        mkdir -p ./final-release-assets
        
        echo "🔍 Contenu complet des artifacts téléchargés:"
        find ./all-artifacts -type f -name "*.apk" -o -name "*.aab"
        
        echo "📁 Structure des dossiers artifacts:"
        ls -la ./all-artifacts/
        
        # 📱 APK RELEASE - Detection automatique
        RELEASE_APK=$(find ./all-artifacts/lux-keyboard-release-apk -name "*.apk" | head -1)
        if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
          cp "$RELEASE_APK" "./final-release-assets/LetzebuergeschClavier-Release-${{ github.ref_name }}.apk"
          echo "✅ APK Release: LetzebuergeschClavier-Release-${{ github.ref_name }}.apk (source: $(basename $RELEASE_APK))"
          # Copie au nom fixe : cible du lien permanent /releases/latest/download/
          # utilisé par le site et le QR code (docs/index.md). Ne pas renommer.
          cp "$RELEASE_APK" "./final-release-assets/LetzebuergeschClavier-latest.apk"
          echo "✅ APK Release (alias permanent): LetzebuergeschClavier-latest.apk"
        else
          echo "❌ APK release non trouvé"
          echo "📁 Contenu dossier release APK:"
          ls -la ./all-artifacts/lux-keyboard-release-apk/ || echo "Dossier APK release inexistant"
          echo "🔍 Recherche de fichiers APK:"
          find ./all-artifacts/lux-keyboard-release-apk -name "*.apk" || echo "Aucun fichier APK trouvé"
        fi
        
        # 🔧 APK DEBUG - Detection automatique  
        DEBUG_APK=$(find ./all-artifacts/lux-keyboard-debug-apk -name "*.apk" | head -1)
        if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
          cp "$DEBUG_APK" "./final-release-assets/LetzebuergeschClavier-Debug-${{ github.ref_name }}.apk"
          echo "✅ APK Debug: LetzebuergeschClavier-Debug-${{ github.ref_name }}.apk (source: $(basename $DEBUG_APK))"
        else
          echo "❌ APK debug non trouvé"
          echo "📁 Contenu dossier debug APK:"
          ls -la ./all-artifacts/lux-keyboard-debug-apk/ || echo "Dossier APK debug inexistant"
          echo "🔍 Recherche de fichiers APK:"
          find ./all-artifacts/lux-keyboard-debug-apk -name "*.apk" || echo "Aucun fichier APK trouvé"
        fi
        
        # 📦 AAB RELEASE - Detection automatique
        RELEASE_AAB=$(find ./all-artifacts/lux-keyboard-release-aab -name "*.aab" | head -1)
        if [ -n "$RELEASE_AAB" ] && [ -f "$RELEASE_AAB" ]; then
          cp "$RELEASE_AAB" "./final-release-assets/LetzebuergeschClavier-Release-${{ github.ref_name }}.aab"
          echo "✅ AAB Release: LetzebuergeschClavier-Release-${{ github.ref_name }}.aab (source: $(basename $RELEASE_AAB))"
        else
          echo "❌ AAB release non trouvé"
          echo "📁 Contenu dossier release AAB:"
          ls -la ./all-artifacts/lux-keyboard-release-aab/ || echo "Dossier AAB release inexistant"
          echo "🔍 Recherche de fichiers AAB:"
          find ./all-artifacts/lux-keyboard-release-aab -name "*.aab" || echo "Aucun fichier AAB trouvé"
        fi
        
        # 🔧 AAB DEBUG - Detection automatique
        DEBUG_AAB=$(find ./all-artifacts/lux-keyboard-debug-aab -name "*.aab" | head -1)
        if [ -n "$DEBUG_AAB" ] && [ -f "$DEBUG_AAB" ]; then
          cp "$DEBUG_AAB" "./final-release-assets/LetzebuergeschClavier-Debug-${{ github.ref_name }}.aab"
          echo "✅ AAB Debug: LetzebuergeschClavier-Debug-${{ github.ref_name }}.aab (source: $(basename $DEBUG_AAB))"
        else
          echo "❌ AAB debug non trouvé"
          echo "📁 Contenu dossier debug AAB:"
          ls -la ./all-artifacts/lux-keyboard-debug-aab/ || echo "Dossier AAB debug inexistant"
          echo "🔍 Recherche de fichiers AAB:"
          find ./all-artifacts/lux-keyboard-debug-aab -name "*.aab" || echo "Aucun fichier AAB trouvé"
        fi
        
        echo ""
        echo "📊 ASSETS FINAUX PRÉPARÉS:"
        ls -la ./final-release-assets/
        echo ""
        echo "📝 RÉSUMÉ:"
        find ./final-release-assets -name "*.apk" -o -name "*.aab" | while read file; do
          size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
          echo "  📱 $(basename "$file"): ${size} bytes"
        done

    - name: 🎉 Create GitHub Release with Assets
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: 🇱🇺 Lëtzebuergesch Clavier ${{ github.ref_name }}
        body_path: /tmp/release-notes.md
        draft: false
        prerelease: false
        make_latest: true
        files: ./final-release-assets/*
        
    - name: 📊 Add Build Statistics to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📊 Ajout des statistiques de build à la release..."
        
        # Créer un commentaire avec les statistiques techniques
        STATS_COMMENT="
        
        ---
        
        ## 📊 Statistiques de Build
        
        🔤 **DICTIONNAIRE LËTZEBUERGESCH**
        - ✅ **${{ needs.generate-dictionary.outputs.dict-count }}** mots luxembourgeois
        - 🧠 **${{ needs.generate-dictionary.outputs.ngrams-count }}** N-grams prédictifs
        - 📡 Synchronisation automatique Hugging Face
        
        📱 **FICHIERS DISPONIBLES**
        - 📱 **APK Release** - Installation directe (recommandé pour utilisateurs finaux)
        - 🔧 **APK Debug** - Version de développement avec logs détaillés
        - 🏪 **AAB Release** - Bundle Google Play Store (distribution officielle)
        - 🛠️ **AAB Debug** - Bundle de développement pour tests
        
        � **Build Scan Reports** - Consultez les rapports détaillés dans les logs GitHub Actions
        
        ---
        
         **Lëtzebuergesch lieft!** 
        "
        
        # Ajouter le commentaire à la release existante
        gh release edit "${{ github.ref_name }}" --notes-file /tmp/release-notes.md --notes "$STATS_COMMENT" || echo "⚠️ Impossible d'ajouter les statistiques (release peut-être déjà complète)"

    # L'étape « Update docs/index.md with New Version » vivait ici : elle
    # réécrivait « 📲 Télécharger l'APK (version X.Y.Z) » dans docs/index.md à
    # chaque tag, puis committait et poussait sur main depuis la CI.
    #
    # Elle est retirée parce que 811915ea a délibérément supprimé ce numéro du
    # site — le bouton pointe désormais sur `releases/latest/download/`, qui
    # sert toujours la dernière version sans que personne ait à la recopier.
    # L'étape a donc continué à exiger une ligne qui n'existait plus, et a fait
    # échouer la publication de la v10.20.0 alors que la Release et ses cinq
    # artefacts étaient déjà créés : un rouge sans objet, qui masquerait un vrai
    # échec la fois suivante.
    #
    # Ne pas la remettre sans remettre d'abord un numéro de version figé dans
    # docs/index.md, ce que le site ne veut plus.
