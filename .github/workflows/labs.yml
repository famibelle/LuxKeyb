name: 🧪 Labs — build expérimental installable

# Canal d'essai, séparé de build-apk.yml.
#
# build-apk.yml ne se déclenche que sur `main` et les tags `v*` : une branche de
# fonctionnalité comme feat/speech-to-text-lb n'y produit donc aucun APK, et il
# n'existait aucun moyen de faire essayer la dictée vocale à quelqu'un sans lui
# demander de compiler le projet — ce qui suppose le NDK, le JDK 17 et la
# conversion du modèle whisper.
#
# Cette copie du workflow est celle de la branche `feat/luxasr-online` : la
# reconnaissance y passe par le service de l'Uni.lu, donc le job qui convertit
# le modèle whisper (pip install torch, ~2 minutes) a été retiré et la
# vérification de l'APK est inversée — le modèle doit en être ABSENT. La branche
# de la dictée embarquée garde sa propre copie, où le modèle reste obligatoire.
# GitHub Actions exécute toujours le fichier du ref poussé : les deux ne se
# marchent pas dessus.
#
# Ce workflow publie une préversion GitHub sous un tag fixe, `labs`, pour que
# l'adresse de téléchargement ne change jamais :
#
#   https://github.com/famibelle/LuxKeyb/releases/download/labs/LetzebuergeschClavier-Labs.apk
#
# La préversion est explicitement `prerelease` et `make_latest: false` : sans
# quoi elle deviendrait la « latest » du dépôt et le bouton de téléchargement du
# site (docs/simulateur.html pointe sur releases/latest/download/…) servirait un
# build de laboratoire aux visiteurs ordinaires.

permissions:
  contents: write

on:
  push:
    branches:
      - 'feat/**'
      - 'labs/**'
    paths:
      - 'android_keyboard/**'
      - 'Dictionnaires/**'
      - 'stt/**'
      - '.github/workflows/labs.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier la préversion « labs » (sinon, artefact du run seulement)"
        type: boolean
        default: true

concurrency:
  # Un seul build Labs à la fois par branche : deux runs concurrents se
  # disputeraient le tag `labs` et le dernier à finir gagnerait, pas le dernier
  # commit poussé.
  group: labs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  dictionary:
    name: 🔤 Dictionnaire
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 📦 Régénérer le dictionnaire
      run: |
        cd Dictionnaires
        python -m pip install --upgrade pip
        pip install datasets huggingface_hub
        python LuxembourgishComplet.py --strict

    - name: ✅ Garde-fous de volumétrie
      run: |
        set -euo pipefail
        A=android_keyboard/app/src/main/assets
        # Mêmes invariants que build-apk.yml : un dictionnaire au mauvais type
        # JSON reste un JSON valide et désactive silencieusement toutes les
        # suggestions, et des n-grammes sans clés à deux mots rendent la
        # prédiction contextuelle inerte sans rien casser de visible.
        jq -e 'type == "array"' "$A/luxemburgish_dict.json" > /dev/null
        DICT=$(jq 'length' "$A/luxemburgish_dict.json")
        NG=$(jq 'keys | length' "$A/luxemburgish_ngrams.json")
        TWO=$(jq '[keys[] | select(test(" "))] | length' "$A/luxemburgish_ngrams.json")
        # La casse est élue sur le corpus (Groussschreiwung) : un repli en
        # minuscules passerait tous les autres contrôles sans rien casser de
        # visible, mais le clavier ne proposerait plus jamais « Joer ».
        CAPS=$(jq '[.[] | .[0] | select(test("^\\p{Lu}"))] | length' "$A/luxemburgish_dict.json")
        echo "📊 $DICT mots (dont $CAPS capitalisés), $NG contextes (dont $TWO à deux mots)"
        [ "$DICT" -ge 20000 ] || { echo "::error::dictionnaire trop petit ($DICT)"; exit 1; }
        [ "$NG" -ge 15000 ] || { echo "::error::n-grammes trop peu nombreux ($NG)"; exit 1; }
        [ "$TWO" -gt 0 ] || { echo "::error::aucune clé de contexte à deux mots"; exit 1; }
        [ "$CAPS" -ge 15000 ] || { echo "::error::casse canonique perdue ($CAPS entrées capitalisées)"; exit 1; }

    - uses: actions/upload-artifact@v6
      with:
        name: labs-dictionary
        path: |
          android_keyboard/app/src/main/assets/luxemburgish_dict.json
          android_keyboard/app/src/main/assets/luxemburgish_ngrams.json
        retention-days: 1

  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ APK Labs
    runs-on: ubuntu-latest
    needs: [dictionary]

    env:
      KEYSTORE_FILE: potomitan-keystore.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    outputs:
      apk-name: ${{ steps.rename.outputs.apk-name }}
      version: ${{ steps.rename.outputs.version }}

    steps:
    - uses: actions/checkout@v5
      with:
        # whisper.cpp est un sous-module : sans lui la configuration CMake de la
        # dictée échoue et emporte tout le build Gradle.
        submodules: recursive

    - uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: 9.6.1

    - name: 📥 Dictionnaire régénéré
      uses: actions/download-artifact@v7
      with:
        name: labs-dictionary
        path: android_keyboard/app/src/main/assets/

    - name: 🧪 Tests unitaires
      run: cd android_keyboard && gradle testDebugUnitTest --no-daemon

    - name: 🔐 Clé de signature
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        cd android_keyboard
        if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] \
           || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
          # Pas de repli sur une clé debug, contrairement aux jobs de
          # build-apk.yml : un APK Labs signé debug ne peut pas se réinstaller
          # par-dessus une version stable, et le testeur ne découvrirait le
          # problème qu'au moment de l'installation.
          echo "::error::Secrets de signature absents. Labs exige la clé de production."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
        keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" \
          -storepass "$STORE_PASSWORD" | grep "SHA1:"

    - name: 🚀 Construire l'APK Labs
      # assembleLabs et non assembleRelease : le type de build `labs` est
      # identique à release — même signature, donc réinstallable par-dessus une
      # version stable — mais substitue une icône de lancement portant la
      # mention « LABS ». Les deux builds partagent l'applicationId et ne
      # peuvent pas cohabiter : le bandeau est le seul repère visuel du testeur.
      run: cd android_keyboard && gradle assembleLabs --no-daemon

    - name: ✅ La dictée est-elle réellement dans l'APK ?
      run: |
        set -euo pipefail
        cd android_keyboard
        APK=$(ls app/build/outputs/apk/labs/*.apk | head -1)
        echo "📦 $APK"

        # Tout l'intérêt de ce canal est de livrer la dictée : on vérifie ce
        # qu'on annonce plutôt que de l'espérer. Chacun de ces trois points
        # peut manquer sans faire échouer le build.

        # 1. La bibliothèque native, sur les deux ABI de production.
        for ABI in arm64-v8a armeabi-v7a; do
          unzip -l "$APK" | grep -q "lib/$ABI/libluxstt.so" \
            || { echo "::error::libluxstt.so absent pour $ABI"; exit 1; }
        done

        # 2. Le modèle whisper doit être ABSENT — c'est l'inverse de ce que
        #    vérifie la branche de la dictée embarquée. La reconnaissance passe
        #    ici par luxasr.uni.lu ; un modèle réempaqueté par accident ferait
        #    un APK de 38 Mo au lieu de 6,2, sans que rien ne s'en aperçoive
        #    puisqu'il ne serait jamais chargé.
        ! unzip -l "$APK" | grep -q 'assets/ggml-.*\.bin' \
          || { echo "::error::le modèle whisper est dans l'APK alors que cette branche l'exclut"; exit 1; }

        # 2 bis. Et le dictionnaire, lui, doit y être : sans lui la vérification
        #    ci-dessus passerait tout aussi bien sur un APK aux assets vides.
        unzip -l "$APK" | grep -q 'assets/luxemburgish_dict.json' \
          || { echo "::error::dictionnaire absent de l'APK"; exit 1; }

        # 3. La signature. apksigner comprend les schémas v2/v3, contrairement à
        #    jarsigner qui ne voit que v1.
        #
        #    La sortie est capturée puis analysée, et non passée directement à
        #    grep : sous `pipefail`, un apksigner qui sort non-zéro faisait
        #    échouer tout le pipeline et la vraie raison se perdait derrière un
        #    « APK non signé » générique.
        APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
        echo "🔧 $APKSIGNER"
        [ -n "$APKSIGNER" ] || { echo "::error::apksigner introuvable sous $ANDROID_HOME"; exit 1; }

        "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apk-verify.txt

        # Une sortie vide ferait passer les deux assertions suivantes sans avoir
        # rien vérifié.
        grep -q "certificate DN" /tmp/apk-verify.txt \
          || { echo "::error::apksigner n'a produit aucune information de certificat"; exit 1; }

        # Décisif pour Labs : un APK signé debug s'installe, mais jamais
        # par-dessus une version stable, et le testeur ne le découvrirait qu'à ce
        # moment-là.
        ! grep -q "CN=Android Debug" /tmp/apk-verify.txt \
          || { echo "::error::APK signé avec la clé debug, pas avec celle de production"; exit 1; }

        echo "✅ libluxstt.so (2 ABI), aucun modèle embarqué, dictionnaire présent, signature de production"

    - name: 🏷️ Nommer l'artefact
      id: rename
      run: |
        set -euo pipefail
        cd android_keyboard
        VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
        SHA=$(git rev-parse --short HEAD)
        NAME="LetzebuergeschClavier-Labs.apk"
        mkdir -p ../labs-out
        cp "$(ls app/build/outputs/apk/labs/*.apk | head -1)" "../labs-out/$NAME"
        # Copie horodatée à côté de l'alias fixe : l'alias sert au lien stable,
        # celle-ci permet de dire exactement quel build un testeur a installé.
        cp "../labs-out/$NAME" "../labs-out/LetzebuergeschClavier-Labs-${VERSION}-${SHA}.apk"
        ls -lh ../labs-out/
        echo "apk-name=$NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION+$SHA" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v6
      with:
        name: labs-apk
        path: labs-out/
        retention-days: 30

  # ---------------------------------------------------------------------------
  publish:
    name: 🚀 Publier la préversion Labs
    runs-on: ubuntu-latest
    needs: build
    # Les branches publiantes sont nommées explicitement, et chacune a SON tag :
    # `labs` pour la dictée embarquée, `labs-luxasr` pour la démonstration en
    # ligne. Sans cette séparation, la seconde écraserait la première et le
    # flashcode du site — qui pointe sur `labs` — servirait un build qui envoie
    # l'audio à un tiers.
    #
    # Toute autre branche feat/** passe quand même par les jobs ci-dessus —
    # tests, garde-fous, APK en artefact du run — elle ne publie simplement pas.
    # Un workflow_dispatch reste maître : il publie depuis la branche choisie.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish)
      || (github.event_name == 'push' && github.ref_name == 'feat/speech-to-text-lb')
      || (github.event_name == 'push' && github.ref_name == 'feat/luxasr-online')

    steps:
    - uses: actions/checkout@v5

    - uses: actions/download-artifact@v7
      with:
        name: labs-apk
        path: labs-out/

    - name: 🏷️ Tag et intitulé selon la branche
      run: |
        if [ "${{ github.ref_name }}" = "feat/luxasr-online" ]; then
          echo "LABS_TAG=labs-luxasr"                          >> $GITHUB_ENV
          echo "LABS_TITLE=🌐 Labs — dictée en ligne LuxASR"    >> $GITHUB_ENV
          echo "LABS_APK=LetzebuergeschClavier-LuxASR-Demo.apk" >> $GITHUB_ENV
        else
          echo "LABS_TAG=labs"                                 >> $GITHUB_ENV
          echo "LABS_TITLE=🧪 Labs — dictée vocale"             >> $GITHUB_ENV
          echo "LABS_APK=LetzebuergeschClavier-Labs.apk"        >> $GITHUB_ENV
        fi

    - name: 📝 Notes de version — dictée EN LIGNE
      if: github.ref_name == 'feat/luxasr-online'
      run: |
        cat > /tmp/labs-notes.md <<'NOTES'
        # 🌐 Démonstration — dictée en ligne LuxASR

        Build de **démonstration**, préparé pour un rendez-vous avec le projet
        LuxASR de l'Université du Luxembourg. Ce n'est ni une version stable, ni
        une préversion destinée aux testeurs.

        ## ⚠️ L'audio quitte le téléphone

        Contrairement à toutes les autres versions de ce clavier, cette
        démonstration **envoie le son du micro au service `luxasr.uni.lu`** pour
        le faire transcrire. Le bandeau de dictée l'indique à l'écran (🌐 LuxASR)
        pendant toute la durée de l'enregistrement.

        La politique de confidentialité publiée du clavier affirme le contraire :
        elle décrit la dictée embarquée, hors ligne, qui reste ce que livrent les
        versions stables et la préversion `labs`. **Cette démonstration ne doit
        pas être diffusée** au-delà de son objet.

        ## Pourquoi elle existe

        La dictée embarquée a été mesurée le 28 août 2026 sur 50 minutes de
        luxembourgeois. Sur des énoncés de longueur clavier, le modèle embarqué
        (`whisper-tiny` luxembourgeois) rend **72 % de WER** ; `whisper-base`
        36 % ; les modèles wav2vec 2.0 luxembourgeois 44 % et 35 %. Il en
        faudrait moins de 15 % pour qu'une dictée fasse gagner du temps plutôt
        que d'en coûter. Et sur un téléphone ancien, une passe coûte 6,2 s quelle
        que soit la longueur de la phrase, parce que whisper encode toujours une
        fenêtre de 30 s.

        Le service LuxASR, qui fait tourner `large-v3-turbo`, transcrit le même
        énoncé correctement, ponctué et capitalisé, en ~270 ms.

        ## Installation

        Page d'installation, avec flashcode et marche à suivre :
        <https://famibelle.github.io/LuxKeyb/labs-luxasr.html>

        L'APK pèse ~6 Mo : le modèle whisper de 31 Mo est **exclu du paquet**,
        n'ayant rien à y faire dès lors que la reconnaissance est distante. Le
        téléphone a besoin d'une connexion pour dicter, et pas seulement pour
        installer — il n'y a pas de repli hors ligne.

        ## Statut

        Le site de LuxASR demande que toute intégration dans une autre
        application fasse l'objet d'un accord préalable. Cette démonstration est
        le support de cette demande, pas son contournement.
        NOTES

    - name: 📝 Notes de version — dictée embarquée
      if: github.ref_name != 'feat/luxasr-online'
      run: |
        cat > /tmp/labs-notes.md <<'NOTES'
        # 🧪 Labs — build expérimental

        Version de test du **Lëtzebuergesch Clavier**, construite automatiquement
        à chaque commit de la branche en cours d'expérimentation. Ce n'est pas
        une version stable et elle n'apparaît pas dans « Releases › Latest ».

        ## Ce qu'elle contient de plus

        **La dictée vocale luxembourgeoise**, entièrement hors ligne. Le modèle
        de reconnaissance (whisper affiné pour le luxembourgeois par le projet
        LuxASR de l'Université du Luxembourg) est embarqué dans l'application :
        **aucun son ne quitte le téléphone**, et l'application ne demande aucune
        permission réseau.

        Le micro se trouve à droite de la barre de suggestions. Un appui démarre
        la dictée, un second la fige ; elle s'arrête aussi seule après un silence.

        ## À savoir avant d'installer

        - **La qualité de la reconnaissance n'est pas mesurée.** Le modèle
          embarqué est le plus petit de sa famille et son taux d'erreur n'est
          publié nulle part. Attendez-vous à des fautes, surtout en milieu bruyant.
        - **L'application pèse ~41 Mo** au lieu de 9 : le modèle en occupe 31 à
          lui seul.
        - Signée avec la même clé que les versions stables, elle **remplace**
          une installation existante. Réinstaller une version stable par-dessus
          la fait revenir en arrière sans perdre vos données.
        - Après l'installation, activez le clavier dans
          *Paramètres › Système › Claviers*, puis autorisez le micro au premier
          appui.

        ## Signaler un problème

        Les retours sur la dictée sont les bienvenus dans les *Issues* du dépôt —
        en précisant le modèle de téléphone, ce que vous avez dit et ce qui s'est
        écrit.
        NOTES

        {
          echo ""
          echo "---"
          echo ""
          echo "Build \`${{ needs.build.outputs.version }}\` · branche \`${{ github.ref_name }}\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
        } >> /tmp/labs-notes.md

    - name: 🚀 Remplacer la préversion du canal
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # Le tag `labs` est volontairement roulant : c'est ce qui garde une URL
        # de téléchargement stable à donner aux testeurs. GitHub ne déplace pas
        # un tag existant à la publication, d'où la suppression préalable de la
        # préversion ET de son tag (--cleanup-tag). Seule la préversion Labs est
        # concernée : les releases `v*` ne sont jamais touchées.
        gh release delete "$LABS_TAG" --yes --cleanup-tag 2>/dev/null || true

        # Nom de fichier distinct par canal : une démonstration qui envoie
        # l'audio en ligne ne doit pas pouvoir être confondue avec la préversion
        # hors ligne, y compris une fois dans le dossier de téléchargement. Les
        # deux APK produits (le fixe et le versionné) sont renommés.
        if [ "$LABS_TAG" = "labs-luxasr" ]; then
          for f in labs-out/*.apk; do
            n=$(basename "$f" | sed 's/Labs/LuxASR-Demo/')
            if [ "$n" != "$(basename "$f")" ]; then
              mv "$f" "labs-out/$n"
            fi
          done
        fi
        ls -l labs-out/

        gh release create "$LABS_TAG" \
          --title "$LABS_TITLE (${{ needs.build.outputs.version }})" \
          --notes-file /tmp/labs-notes.md \
          --prerelease \
          --target "${{ github.sha }}" \
          labs-out/*.apk

        echo "### Préversion publiée sous le tag \`$LABS_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Lien stable :" >> $GITHUB_STEP_SUMMARY
        echo "\`https://github.com/${{ github.repository }}/releases/download/$LABS_TAG/$LABS_APK\`" >> $GITHUB_STEP_SUMMARY
