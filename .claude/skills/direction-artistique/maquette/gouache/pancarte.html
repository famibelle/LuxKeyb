<!doctype html><meta charset="utf-8"><body>
<script src="moteur.js"></script><script src="lieux.js"></script><script src="breedewee.js"></script>
<script src="peint.js"></script><script src="vives.js"></script><script src="bus.js"></script>
<script>
// La carte « Bus » (commune, le matin, à la Rout Bréck) en gouache vive :
// la fenêtre entière, décor en trois cartons puis le dessin du mot, à la
// place exacte de la fenêtre dans le recto à 300 dpi.
const X = 69.25 + 32 * 2.2545, Y = 59 + 34.12 * 2.2545, U = 2.36 * 2.2545;
const W = Math.ceil(100 * U), HH = Math.ceil(66 * U);
const P = VIVES[0];

// Copie de Peintre.routBreck(), avec deux nuages de papier peint dans la
// bande du haut, la seule que le dessin laisse voir.
Peintre.prototype.routBreck = function () {
  const P = this.P, mix = melange, r = Alea(4);
  this.nuagePeint(58, 2.5, 15);
  this.nuagePeint(80, 8, 10);
  const fl = mix(P.loin, P.cielBas, 0.25);
  const tours = [8, 4, 15, 13, 3, 11, 18, 5, 19, 26, 3.4, 13, 31, 4.2, 16, 86, 4, 12, 92, 3, 9];
  for (let i = 0; i < tours.length; i += 3) {
    const x = tours[i], w = tours[i + 1], h = tours[i + 2];
    this.rect(x, 38 - h, w, h, fl);
    if (P.allume) for (let y = 40 - h; y < 36; y += 2.2) if (r() < 0.55) this.rect(x + 0.8, y, w - 1.6, 0.5, P.fenetre, 0.7);
  }
  this.crete(37, 1.6, 6, P.loin);
  this.plan(1);
  this.forme('M0 66L0 38C14 40 28 50 42 62L42 66Z', P.milieu);
  this.forme('M100 66L100 39C86 41 72 50 58 62L58 66Z', P.milieu);
  this.bosquet(0, 40, 46, 2.2, 7, mix(P.milieu, P.pres, 0.45));
  this.bosquet(60, 100, 47, 2.2, 8, mix(P.milieu, P.pres, 0.45));
  this.plan(2);
  this.rect(0, 58, 100, 8, P.pres);
  this.bosquet(34, 66, 60, 2, 9, P.sol);
  const rouge = [0xFFE8432E, 0xFFE0482F, 0xFFB8323A, 0xFF8A2433].map(hx)[P.rang];
  const rc = mix(rouge, 0xFFFFFFFF, 0.25);
  for (const x of [17, 41, 65, 89]) {
    this.trait(`M${x - 5.5} 33.5L${x} 61L${x + 5.5} 33.5`, rouge, 1.5);
    this.trait(`M${x - 0.4} 33.5L${x} 61`, mix(rouge, 0xFF000000, 0.3), 0.5);
  }
  this.rect(-1, 30, 102, 3.6, rouge);
  rectNet.call(this, -1, 30, 102, 0.7, rc);
};

function toile() { const c = document.createElement('canvas'); c.width = W; c.height = HH; return c; }
function calque(seul, ciel, lieu) {
  const t = toile(), c = t.getContext('2d'); c.scale(U, U);
  const p = new Peintre(c, P, seul);
  p.gouache = true;
  if (ciel) p.cielPeint();
  if (lieu) p.routBreck();
  c.setTransform(1, 0, 0, 1, 0, 0);
  return t;
}
function silhouette(src, col = '#000') {
  const t = toile(), c = t.getContext('2d');
  c.drawImage(src, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = col; c.fillRect(0, 0, W, HH); return t;
}
function eclaircir(b, forme, vers, t) {
  const c = b.getContext('2d'); c.globalCompositeOperation = 'source-atop'; c.drawImage(silhouette(forme, css(vers, t)), 0, 0);
  c.globalCompositeOperation = 'source-over';
}
function ombrer(derriere, forme, ecart, force) {
  const o = toile(), oc = o.getContext('2d');
  oc.filter = `blur(${1.1 * U * ecart * 0.6}px)`; oc.drawImage(silhouette(forme, '#0B1020'), 0, -0.55 * U * ecart);
  const c = derriere.getContext('2d'); c.globalAlpha = (P.nuit ? 0.55 : 0.38) * force;
  c.globalCompositeOperation = 'source-atop'; c.drawImage(o, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}
function trancher(b, forme, force = 1) {
  const col = melange(P.cielBas, 0xFFFFFFFF, P.nuit ? 0.3 : 0.6);
  const c = b.getContext('2d'); c.globalAlpha = (P.nuit ? 0.45 : 0.7) * force; c.globalCompositeOperation = 'destination-over';
  c.drawImage(silhouette(forme, css(col)), 0, -Math.max(1, 0.3 * U)); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

// Les trois cartons d'une commune (Paysages.rendrePlans).
const fond = calque(0, true, false), loin = calque(0, false, true);
const couches = [fond, calque(1, false, true), calque(2, false, true)];
const formes = [loin, couches[1], couches[2]].map(s => silhouette(s));
ombrer(fond, formes[0], 1, 0.35); trancher(loin, formes[0], 0.6); fond.getContext('2d').drawImage(loin, 0, 0);
eclaircir(fond, formes[0], P.cielBas, 0.30); eclaircir(couches[1], formes[1], P.cielBas, 0.10);
for (let d = 1; d < couches.length; d++) {
  for (let b = 0; b < d; b++) ombrer(couches[b], formes[d], d - b, b === 0 ? 0.6 : 1);
  trancher(couches[d], formes[d]);
}

// Le dessin du mot, comme Enluminure (CadreOrne.kt, 38.0.0) : posé dans une
// boîte de 66 × 46 centrée en (50, 35,5), nacre du matin, liseré, halo, ombres.
function sujet(c) {
  const n = TRACE_BUS.match(/-?\d*\.?\d+/g).map(Number);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i + 1 < n.length; i += 2) { x0 = Math.min(x0, n[i]); x1 = Math.max(x1, n[i]); y0 = Math.min(y0, n[i + 1]); y1 = Math.max(y1, n[i + 1]); }
  const e = Math.min(46 / (y1 - y0), 66 / (x1 - x0));
  const cx = 50, cy = 59 - 23 - 0.5;
  const w = (x1 - x0) * e, h = (y1 - y0) * e, L0 = cx - w / 2, T0 = cy - h / 2;
  const trace = new Path2D(), m = new DOMMatrix().translate(cx, cy).scale(e).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  trace.addPath(new Path2D(TRACE_BUS), m);
  // Le halo.
  const hx_ = cx, hy = T0 + h / 2 - 0.16 * h, hr = Math.min(0.87 * Math.max(w, h), 40);
  c.save(); c.translate(hx_, hy); c.scale(1, 24 / 27); c.translate(-hx_, -hy);
  const g = c.createRadialGradient(hx_, hy, 0, hx_, hy, hr);
  g.addColorStop(0, 'rgba(255,255,255,0.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(hx_, hy, hr, 0, 7); c.fill(); c.restore();
  // La pancarte sur son pied : le dessin est un carton découpé, monté sur une
  // tige de bois plantée dans un socle posé au sol, comme les figurines d'un
  // théâtre de papier.
  const SOL = 62.6, pied = 4, px0 = cx - pied / 2;
  // L'ombre du socle sur le sol.
  c.fillStyle = 'rgba(0,0,0,0.28)';
  c.beginPath(); c.ellipse(cx, SOL + 0.6, 9.5, 1.6, 0, 0, 7); c.fill();
  // La tige, derrière le carton : du bois peint, avec son ombre.
  const peintre = new Peintre(c, P);
  peintre.peint(`M${px0} ${cy}L${px0 + pied} ${cy}L${px0 + pied} ${SOL}L${px0} ${SOL}Z`, hx(0xFF9A6A3C), Math.PI / 2,
    [px0, cy, px0 + pied, SOL], 1);
  // Le socle : une petite planche, et deux équerres qui tiennent la tige.
  peintre.peint(`M${cx - 7.5} ${SOL - 1.8}L${cx + 7.5} ${SOL - 1.8}L${cx + 8.2} ${SOL + 0.6}L${cx - 8.2} ${SOL + 0.6}Z`,
    hx(0xFF7E5530), 0, [cx - 8.2, SOL - 1.8, cx + 8.2, SOL + 0.6], 1);
  for (const sx of [-1, 1]) {
    peintre.peint(`M${cx + sx * pied / 2} ${SOL - 1.8}L${cx + sx * pied / 2} ${SOL - 6}L${cx + sx * (pied / 2 + 3.8)} ${SOL - 1.8}Z`,
      hx(0xFF8A5E34), 0, null, 0.6);
  }
  // L'ombre portée de la pancarte sur le décor, puis son épaisseur de carton.
  c.save(); c.translate(0.9, 1.3); c.fillStyle = 'rgba(0,0,0,0.30)'; c.fill(trace, 'evenodd'); c.restore();
  for (let k = 5; k >= 1; k--) {
    c.save(); c.translate(0.12 * k, 0.16 * k);
    c.fillStyle = k === 5 ? '#7A5532' : '#A07A50'; c.fill(trace, 'evenodd'); c.restore();
  }
  // La nacre du matin et son liseré.
  const nacre = c.createLinearGradient(L0, T0, L0 + w * 0.7, T0 + h);
  nacre.addColorStop(0, '#FFFFFF'); nacre.addColorStop(0.55, '#EBE7EF'); nacre.addColorStop(1, '#CDD5DF');
  c.fillStyle = nacre; c.fill(trace, 'evenodd');
  c.strokeStyle = 'rgba(127,138,150,0.78)'; c.lineWidth = 0.35; c.lineJoin = 'round'; c.stroke(trace);
}

const page = document.createElement('canvas'); page.width = 815; page.height = 1110;
const pc = page.getContext('2d');
couches.forEach(b => pc.drawImage(b, X, Y));
pc.save(); pc.translate(X, Y); pc.scale(U, U); sujet(pc); pc.restore();
window.SORTIE = page.toDataURL('image/png');
</script>
