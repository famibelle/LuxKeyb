// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // Kotlin est compilé nativement par AGP depuis la 9.0 (built-in Kotlin) :
    // le plugin org.jetbrains.kotlin.android est incompatible avec la nouvelle DSL.
    id 'com.android.application' version '9.3.1' apply false
}
