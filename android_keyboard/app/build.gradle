plugins {
    id 'com.android.application'
}

android {
    compileSdk = 36
    namespace 'com.example.kreyolkeyboard'

    // Épinglé : AGP réclame sinon la version NDK qu'il considère par défaut,
    // qui n'est pas forcément celle installée, et l'erreur ne se voit qu'au
    // premier build touchant au C++ (dictée vocale).
    ndkVersion '27.0.12077973'

    signingConfigs {
        debug {
            // Configuration debug par défaut (automatique)
        }
        
        release {
            // Priorité : keystore.properties (local, jamais versionné) > gradle.properties > System.getenv (GitHub Actions)
            def keystoreProps = new Properties()
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (keystorePropsFile.exists()) {
                keystorePropsFile.withInputStream { keystoreProps.load(it) }
            }
            def signingProp = { String name ->
                keystoreProps.getProperty(name) ?: project.findProperty(name) ?: System.getenv(name)
            }

            def keystoreFile = signingProp('KEYSTORE_FILE')
            def storePass = signingProp('STORE_PASSWORD')
            def keyAliasEnv = signingProp('KEY_ALIAS')
            def keyPass = signingProp('KEY_PASSWORD')

            // Chemin résolu depuis android_keyboard/ et non depuis app/ : c'est là que
            // vit le keystore, et les diagnostics plus bas relisent ce chemin résolu.
            // Le file(keystoreFile) d'upstream le chercherait dans app/.
            def keystorePath = keystoreFile ? rootProject.file(keystoreFile) : null

            if (keystoreFile && keystorePath && keystorePath.exists() && storePass && keyAliasEnv && keyPass) {
                // Signature de production (local ou GitHub Actions)
                println "✅ Production signing enabled with keystore: ${keystorePath.absolutePath}"
                storeFile keystorePath
                storePassword storePass
                keyAlias keyAliasEnv
                keyPassword keyPass
                v1SigningEnabled true
                v2SigningEnabled true
                project.ext.releaseSigningReady = true
            } else {
                // Aucun repli vers la clé debug : un AAB signé debug est refusé par
                // Play, et le fallback silencieux ne se voyait qu'au moment du rejet.
                //
                // L'échec ne peut pas être levé ici : ce bloc est évalué à CHAQUE
                // invocation de Gradle (assembleDebug, tests, synchro IDE), pas
                // seulement pour les tâches de release. On se contente de noter
                // l'état ; le refus est prononcé plus bas, sur les tâches qui
                // produisent réellement l'artefact de release.
                println "⚠️ Release signing non configuré (les builds debug restent possibles) :"
                println "   - Keystore path: ${keystoreFile}"
                println "   - Keystore resolved: ${keystorePath?.absolutePath ?: 'N/A'}"
                println "   - Keystore exists: ${keystorePath?.exists() ?: false}"
                println "   - Store password: ${storePass ? '***' : 'MISSING'}"
                println "   - Key alias: ${keyAliasEnv ?: 'MISSING'}"
                println "   - Key password: ${keyPass ? '***' : 'MISSING'}"
                project.ext.releaseSigningReady = false
            }
        }
    }

    defaultConfig {
        // Publiable sur Google Play, contrairement au préfixe com.example.* qui y
        // est refusé. Le namespace (donc le package Kotlin) reste
        // com.example.kreyolkeyboard : le renommer casserait tout sans rien apporter.
        applicationId "com.potomitan.luxkeyboard"
        minSdk = 21
        targetSdk = 36
        versionCode = 101900
        versionName "10.19.0"
        
        // Améliorer la compatibilité Samsung ULTRA
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        
        // Paramètres Samsung spéciaux
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // Dictée vocale : whisper.cpp compilé pour les deux ABI ci-dessus.
        externalNativeBuild {
            cmake {
                // STL statique : le .so de la dictée est le seul consommateur de
                // la libc++ du projet, l'embarquer évite un second .so par ABI.
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-O3', '-ffast-math', '-fno-finite-math-only'
            }
        }
    }

    // Configuration pour Android App Bundle (AAB)
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release // 🔐 Signature de production pour Play Store
            zipAlignEnabled = true
            debuggable = false
            
            // Optimisations supplémentaires
            multiDexEnabled = true
            crunchPngs = true
            
            // Samsung compatibility flags
            manifestPlaceholders = [
                samsungCompat: "true",
                legacyCompat: "true"
            ]
        }
        // Canal Labs : identique à release — même signature, donc réinstallable
        // par-dessus une version stable — à ceci près que src/labs/res/ y
        // substitue une icône de lancement portant la mention « LABS ». Les
        // deux builds partagent l'applicationId et ne peuvent pas cohabiter sur
        // le téléphone : le bandeau est le seul moyen pour un testeur de savoir
        // lequel des deux il a sous les yeux.
        //
        // Un type de build plutôt qu'une variante de produit : celles-ci
        // multiplieraient les tâches (assembleStableRelease, assembleLabsRelease…)
        // et casseraient build-apk.yml, qui n'a rien à voir avec ce canal.
        labs {
            initWith release
            // Les dépendances AAR ne publient que debug et release : sans ce
            // repli, la résolution échoue sur un type de build qu'elles ignorent.
            matchingFallbacks = ['release']
        }
        debug {
            // Configuration pour le build de debug
            debuggable = true
            minifyEnabled = false
            shrinkResources = false

            // x86_64 uniquement en debug, pour que la dictée vocale soit
            // testable sur émulateur : les AVD courants sont x86_64, et sans
            // cette ABI libluxstt.so est absent de l'APK, donc la dictée
            // s'annonce indisponible sans qu'on puisse rien observer. Les
            // artefacts de release restent strictement ARM.
            ndk {
                abiFilters 'x86_64'
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    androidResources {
        // Le modèle ggml doit rester NON compressé dans l'APK : c'est ce qui
        // permet à AAsset_getBuffer() de renvoyer un pointeur mmap'é sur la
        // région de l'APK au lieu de décompresser 31 Mo en RAM à chaque
        // ouverture du micro. Un .bin compressé serait de toute façon inutile,
        // les poids quantifiés n'étant plus compressibles.
        noCompress 'bin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Kotlin built-in (AGP 9+) reprend automatiquement jvmTarget depuis
    // compileOptions.targetCompatibility ci-dessus, plus besoin de kotlinOptions.

    testOptions {
        // Les tests JVM appellent du code qui loggue via android.util.Log :
        // sans cette option, chaque Log.d lève "Method d not mocked"
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig = true
    }
}

// Personnalise le nom des fichiers APK/AAB (remplace l'ancienne API
// applicationVariants.configureEach, retirée avec la nouvelle DSL AGP 9+).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def date = new Date().format('yyyy-MM-dd')
            def versionName = output.versionName.getOrElse(variant.name)
            output.outputFileName.set("Letzebuergesch_Clavier_v${versionName}_${variant.buildType}_${date}.apk")
        }
    }
}

// Refus explicite de produire une release qu'on ne peut pas signer en
// production. La vérification est accrochée aux tâches qui valident, signent et
// empaquettent l'artefact, et non à assembleRelease/bundleRelease : un doFirst
// sur ces tâches agrégées s'exécuterait après leurs dépendances, donc trop tard.
// AGP finit par échouer de lui-même sur validateSigningRelease, mais avec un
// message qui ne dit pas quoi configurer. Liste explicite plutôt qu'un motif :
// packageReleaseResources, qui fusionne des ressources et ne signe rien, se
// ferait attraper au passage.
tasks.matching {
    it.name in ['validateSigningRelease', 'packageRelease', 'signReleaseBundle', 'packageReleaseBundle',
                'validateSigningLabs', 'packageLabs', 'signLabsBundle', 'packageLabsBundle']
}.configureEach {
    doFirst {
        if (!project.ext.releaseSigningReady) {
            throw new GradleException(
                "Release signing configuration is incomplete. " +
                "Configure KEYSTORE_FILE, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD " +
                "(gradle.properties ou variables d'environnement) : la clé debug " +
                "est refusée par le Play Store."
            )
        }
    }
}

// Le modèle de dictée vocale n'est plus versionné (31 Mo) : la CI le régénère
// depuis Hugging Face et le dépose dans les assets, comme le dictionnaire.
//
// Son absence ne casse aucun build — un asset manquant est simplement absent de
// l'APK — mais elle produit un clavier dont le bouton micro s'excuse à chaque
// appui. C'est exactement le genre de panne silencieuse que ce dépôt paie déjà
// ailleurs, d'où le refus explicite sur les tâches de release, calqué sur celui
// de la signature. Les builds debug se contentent d'un avertissement : un
// développeur qui n'a pas encore converti le modèle doit pouvoir travailler sur
// le reste du clavier.
def sttModel = file('src/main/assets/ggml-lb-tiny-q5_1.bin')
def sttModelHint =
    "Modèle de dictée vocale absent (${sttModel.name}). " +
    "Régénérez-le : python stt/convert_model.py --output android_keyboard/app/src/main/assets"

if (!sttModel.exists()) {
    println "⚠️  ${sttModelHint}"
}

tasks.matching {
    it.name in ['packageRelease', 'packageReleaseBundle', 'packageLabs', 'packageLabsBundle']
}.configureEach {
    doFirst {
        if (!sttModel.exists()) {
            throw new GradleException(sttModelHint)
        }
        // Un asset tronqué (téléchargement interrompu, artefact CI partiel) se
        // charge sans erreur visible jusqu'à l'appel natif. 25 Mo est un plancher
        // large : le fichier q5_1 en pèse 31.
        def mo = sttModel.length() / 1e6
        if (mo < 25) {
            throw new GradleException(
                "Modèle de dictée vocale tronqué : ${String.format('%.1f', mo)} Mo " +
                "au lieu des ~31 Mo attendus."
            )
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Panneau emoji exhaustif : grilles virtualisées par catégorie (RecyclerView)
    // paginées par swipe latéral (ViewPager2), sans Fragments (non applicable
    // dans le contexte d'un InputMethodService)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Demande d'avis Google Play (In-App Review)
    implementation 'com.google.android.play:review-ktx:2.0.2'

    // Nouvelles dépendances pour Android 14+ et amélioration stabilité
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    
    // Dépendances de test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.22'
    // Implémentation réelle de org.json pour les tests JVM (sinon le stub Android renvoie des valeurs vides)
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

