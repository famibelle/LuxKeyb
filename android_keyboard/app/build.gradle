plugins {
    id 'com.android.application'
}

android {
    compileSdk = 36
    namespace 'com.example.kreyolkeyboard'

    signingConfigs {
        debug {
            // Configuration debug par défaut (automatique)
        }
        
        release {
            // Priorité : gradle.properties (local) > System.getenv (GitHub Actions)
            def keystoreFile = project.findProperty('KEYSTORE_FILE') ?: System.getenv("KEYSTORE_FILE")
            def storePass = project.findProperty('STORE_PASSWORD') ?: System.getenv("STORE_PASSWORD")
            def keyAliasEnv = project.findProperty('KEY_ALIAS') ?: System.getenv("KEY_ALIAS")
            def keyPass = project.findProperty('KEY_PASSWORD') ?: System.getenv("KEY_PASSWORD")

            // Résoudre le chemin relatif depuis le dossier racine du projet (android_keyboard)
            def keystorePath = keystoreFile ? rootProject.file(keystoreFile) : null

            if (keystoreFile && keystorePath && keystorePath.exists() && storePass && keyAliasEnv && keyPass) {
                // Signature de production (local ou GitHub Actions)
                println "✅ Production signing enabled with keystore: ${keystorePath.absolutePath}"
                storeFile keystorePath
                storePassword storePass
                keyAlias keyAliasEnv
                keyPassword keyPass
                v1SigningEnabled true
                v2SigningEnabled true
                project.ext.releaseSigningReady = true
            } else {
                // Aucun repli vers la clé debug : un AAB signé debug est refusé par
                // Play, et le fallback silencieux ne se voyait qu'au moment du rejet.
                //
                // L'échec ne peut pas être levé ici : ce bloc est évalué à CHAQUE
                // invocation de Gradle (assembleDebug, tests, synchro IDE), pas
                // seulement pour les tâches de release. On se contente de noter
                // l'état ; le refus est prononcé plus bas, sur les tâches qui
                // produisent réellement l'artefact de release.
                println "⚠️ Release signing non configuré (les builds debug restent possibles) :"
                println "   - Keystore path: ${keystoreFile}"
                println "   - Keystore resolved: ${keystorePath?.absolutePath ?: 'N/A'}"
                println "   - Keystore exists: ${keystorePath?.exists() ?: false}"
                println "   - Store password: ${storePass ? '***' : 'MISSING'}"
                println "   - Key alias: ${keyAliasEnv ?: 'MISSING'}"
                println "   - Key password: ${keyPass ? '***' : 'MISSING'}"
                project.ext.releaseSigningReady = false
            }
        }
    }

    defaultConfig {
        // Publiable sur Google Play, contrairement au préfixe com.example.* qui y
        // est refusé. Le namespace (donc le package Kotlin) reste
        // com.example.kreyolkeyboard : le renommer casserait tout sans rien apporter.
        applicationId "com.potomitan.luxkeyboard"
        minSdk = 21
        targetSdk = 36
        versionCode = 100905
        versionName "10.9.5"
        
        // Améliorer la compatibilité Samsung ULTRA
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        
        // Paramètres Samsung spéciaux
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Configuration pour Android App Bundle (AAB)
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release // 🔐 Signature de production pour Play Store
            zipAlignEnabled = true
            debuggable = false
            
            // Optimisations supplémentaires
            multiDexEnabled = true
            crunchPngs = true
            
            // Samsung compatibility flags
            manifestPlaceholders = [
                samsungCompat: "true",
                legacyCompat: "true"
            ]
        }
        debug {
            // Configuration pour le build de debug
            debuggable = true
            minifyEnabled = false
            shrinkResources = false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Kotlin built-in (AGP 9+) reprend automatiquement jvmTarget depuis
    // compileOptions.targetCompatibility ci-dessus, plus besoin de kotlinOptions.

    testOptions {
        // Les tests JVM appellent du code qui loggue via android.util.Log :
        // sans cette option, chaque Log.d lève "Method d not mocked"
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig = true
    }
}

// Personnalise le nom des fichiers APK/AAB (remplace l'ancienne API
// applicationVariants.configureEach, retirée avec la nouvelle DSL AGP 9+).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def date = new Date().format('yyyy-MM-dd')
            def versionName = output.versionName.getOrElse(variant.name)
            output.outputFileName.set("Letzebuergesch_Clavier_v${versionName}_${variant.buildType}_${date}.apk")
        }
    }
}

// Refus explicite de produire une release qu'on ne peut pas signer en
// production. La vérification est accrochée aux tâches qui valident, signent et
// empaquettent l'artefact, et non à assembleRelease/bundleRelease : un doFirst
// sur ces tâches agrégées s'exécuterait après leurs dépendances, donc trop tard.
// AGP finit par échouer de lui-même sur validateSigningRelease, mais avec un
// message qui ne dit pas quoi configurer. Liste explicite plutôt qu'un motif :
// packageReleaseResources, qui fusionne des ressources et ne signe rien, se
// ferait attraper au passage.
tasks.matching {
    it.name in ['validateSigningRelease', 'packageRelease', 'signReleaseBundle', 'packageReleaseBundle']
}.configureEach {
    doFirst {
        if (!project.ext.releaseSigningReady) {
            throw new GradleException(
                "Release signing configuration is incomplete. " +
                "Configure KEYSTORE_FILE, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD " +
                "(gradle.properties ou variables d'environnement) : la clé debug " +
                "est refusée par le Play Store."
            )
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Panneau emoji exhaustif : grilles virtualisées par catégorie (RecyclerView)
    // paginées par swipe latéral (ViewPager2), sans Fragments (non applicable
    // dans le contexte d'un InputMethodService)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Demande d'avis Google Play (In-App Review)
    implementation 'com.google.android.play:review-ktx:2.0.2'

    // Nouvelles dépendances pour Android 14+ et amélioration stabilité
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.concurrent:concurrent-futures-ktx:1.2.0'
    
    // Dépendances de test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.22'
    // Implémentation réelle de org.json pour les tests JVM (sinon le stub Android renvoie des valeurs vides)
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

